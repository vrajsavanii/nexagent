<svg xmlns="http://www.w3.org/2000/svg" width="201" height="44" viewBox="0 0 201 44" fill="none">
  <defs>
    <!-- Gradient for N letterform matching logo.jpeg -->
    <linearGradient id="na_n_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E8D9C"/>
      <stop offset="50%" stop-color="#365C6A"/>
      <stop offset="100%" stop-color="#1B2B38"/>
    </linearGradient>
    <!-- Gradient for A letterform matching logo.jpeg -->
    <linearGradient id="na_a_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D4C3"/>
      <stop offset="60%" stop-color="#A58E7E"/>
      <stop offset="100%" stop-color="#604E48"/>
    </linearGradient>
    <filter id="subtle_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Central Card Content Container -->
  <g transform="translate(6, 6)" filter="url(#subtle_shadow)">
    <!-- 3D Monogram N -->
    <path d="M2 30 L2 2 L16 18 L16 30 Z" fill="url(#na_n_grad)"/>
    <path d="M16 2 L23 2 L23 18 L16 18 Z" fill="#789A9C"/>

    <!-- 3D Monogram A -->
    <path d="M22 30 L32 2 L38 2 L28 30 Z" fill="url(#na_a_grad)"/>
    <path d="M29 23 L40 23 L37 30 L26 30 Z" fill="#6B5953"/>
  </g>

  <!-- Brand Typography -->
  <text x="56" y="27.5" font-family="'Urbanist', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="900" fill="#202226" letter-spacing="0.04em">NEXAGENT</text>

  <!-- Autonomous Status Dot -->
  <circle cx="188" cy="22" r="3.5" fill="#10A37F"/>
  <circle cx="188" cy="22" r="6" fill="#10A37F" opacity="0.25"/>
</svg>